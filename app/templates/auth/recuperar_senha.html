<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIRAE — Recuperar senha</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">

    <div class="login-header">
      <div class="login-logo">
        <div class="login-logo-mark">S</div>
        <span class="login-logo-name">SIRAE · SENAI</span>
      </div>
      <h1>Recuperar senha</h1>
      <p>Informe seu e-mail e uma senha temporária será gerada.</p>
    </div>

    <div class="login-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <label class="lbl">E-mail institucional
          <input class="field" type="email" name="email"
                 placeholder="seu@email.com" required autofocus>
        </label>
        <div class="login-actions" style="justify-content:space-between">
          <a href="{{ url_for('auth.login') }}"
             style="font-size:13px;color:var(--text-3);text-decoration:none">
            ← Voltar ao login
          </a>
          <button type="submit" class="btn btn-primary">Gerar senha temporária</button>
        </div>
      </form>
    </div>

    <div class="login-footer">
      Acesso restrito · Dados protegidos pela LGPD
    </div>

  </div>
</div>
</body>
</html>
