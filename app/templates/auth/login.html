<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIRAE — Acesso</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f1f4f8;
      padding: 24px 16px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(15,22,35,.12);
      overflow: hidden;
    }

    .login-top {
      background: #c00d0d;
      padding: 36px 36px 32px;
      text-align: center;
    }

    .login-top .marca {
      font-size: 36px;
      font-weight: 900;
      color: white;
      letter-spacing: 3px;
      line-height: 1;
    }

    .login-top .sub {
      font-size: 11px;
      color: rgba(255,255,255,.65);
      text-transform: uppercase;
      letter-spacing: .14em;
      margin-top: 8px;
    }

    .login-body {
      padding: 32px 36px 36px;
    }

    .login-body .lbl {
      margin-bottom: 14px;
      display: block;
    }

    .login-footer {
      text-align: center;
      font-size: 11.5px;
      color: var(--text-3);
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-top">
    <div class="marca">SIRAE</div>
    <div class="sub">Registro e Acompanhamento Estudantil</div>
  </div>

  <div class="login-body">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert {{ category }}" style="margin-bottom:16px">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" id="login-form">
      <label class="lbl">E-mail
        <input class="field" type="email" name="email"
               placeholder="seu@email.com" required autofocus style="margin-top:5px">
      </label>
      <label class="lbl">Senha
        <input class="field" type="password" name="password"
               placeholder="••••••••" required style="margin-top:5px">
      </label>
      <button type="submit" class="btn btn-primary"
              style="width:100%;justify-content:center;height:42px;font-size:15px;margin-top:4px"
              onclick="this.textContent='Entrando…';this.disabled=true;document.getElementById('login-form').submit()">
        Entrar
      </button>
    </form>

    <div class="login-footer">Acesso restrito · LGPD</div>
  </div>
</div>


<script>
(function() {
  function addCapsWarn(input) {
    var warn = document.createElement('span');
    warn.className = 'caps-warn';
    warn.textContent = '⚠ Caps Lock ativado';
    warn.style.cssText = 'display:none;font-size:11px;color:#b45309;margin-top:2px;font-weight:500';
    input.parentNode.insertBefore(warn, input.nextSibling);
    function check(e) {
      var caps = e.getModifierState && e.getModifierState('CapsLock');
      warn.style.display = caps ? 'block' : 'none';
    }
    input.addEventListener('keyup', check);
    input.addEventListener('keydown', check);
    input.addEventListener('focus', check);
  }
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('input[type="password"]').forEach(addCapsWarn);
  });
})();
</script>

</body>
</html>
